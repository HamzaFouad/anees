name: Release

# Triggered when you push a version tag like v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  # ── macOS .app ────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build .app
        run: pyinstaller anees.spec --clean --noconfirm

      - name: Zip the app bundle
        run: |
          cd dist
          zip -r Anees-macOS.zip Anees.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anees-macOS
          path: dist/Anees-macOS.zip

  # ── Windows .exe ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download static ffmpeg for bundling
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path vendor\win-x64
          Copy-Item "ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "vendor\win-x64\ffmpeg.exe"
          Remove-Item -Recurse -Force ffmpeg_tmp, ffmpeg.zip

      - name: Build .exe
        run: pyinstaller anees.spec --clean --noconfirm

      - name: Zip the Windows folder
        run: |
          cd dist
          Compress-Archive -Path Anees -DestinationPath Anees-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anees-Windows
          path: dist/Anees-Windows.zip

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Anees-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Anees-Windows
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anees ${{ github.ref_name }}"
          body: |
            ## Installation

            ### Windows
            1. Download **Anees-Windows.zip**
            2. **Extract All** to a folder (Desktop, Documents, etc.) — do not run from inside the zip
            3. Open the extracted `Anees` folder → double-click **Anees.exe**

            ffmpeg is bundled — no extra install needed.

            ### macOS
            1. Download **Anees-macOS.zip** and extract
            2. Drag **Anees.app** to `/Applications`
            3. Install ffmpeg if you haven't: `brew install ffmpeg`
          files: |
            artifacts/Anees-macOS.zip
            artifacts/Anees-Windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
